{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Оформить заказ</title>
    <link rel="stylesheet" href="{% static 'css/article.css' %}">
    <link rel="stylesheet" href="{% static 'css/form.css' %}">
</head>
<body>
    <div class="content">
        <h1>Оформить заказ</h1>
        <p class="errors">{{ form.errors }}</p>
        <form method="POST">{% csrf_token %}
            <div class="field">
                <label>Номер договора</label>
                <input type="text" name="contract" placeholder="Номер договора" value="{{ form.contract }}">
            </div>
            <div class="field">
                <label>Вещь</label>
                <input type="text" name="item" placeholder="Вещь" value="{{ form.item }}">
            </div>
            <div class="field">
                <label>Клиент</label>
                <input type="text" name="client" placeholder="Клиент" value="{{ form.client }}">
            </div>
            <div class="field">
                <label>Телефон</label>
                <input type="text" name="phone" placeholder="Телефон" value="{{ form.phone }}">
            </div>
            <div class="field">
                <label>Филиал</label>
                <input type="text" name="branch" placeholder="Филиал" value="{{ form.branch }}">
            </div>
            <div class="field">
                <label>Вид услуги</label>
                <input type="text" name="service" placeholder="Вид услуги" value="{{ form.service }}">
            </div>
            <div class="field">
                <label>Стоимость услуги, руб.</label>
                <input type="number" step="0.01" name="price" placeholder="Стоимость услуги, руб." value="{{ form.price }}">
            </div>
            <div class="field">
                <label>Надбавка за срочность, %</label>
                <input type="number" step="0.01" name="urgency" placeholder="Надбавка за срочность, %" value="{{ form.urgency }}">
            </div>
            <div class="field">
                <label>Надбавка за сложность, %</label>
                <input type="number" step="0.01" name="complexity" placeholder="Надбавка за сложность, %" value="{{ form.complexity }}">
            </div>
            <div class="field">
                <label>Скидка, %</label>
                <input type="number" step="0.01" name="discount" placeholder="Скидка, %" value="{{ form.discount }}">
            </div>
            <div class="field">
                <label>Дата приема</label>
                <input type="date" name="receive_date" value="{{ form.receive_date }}">
            </div>
            <div class="field">
                <label>Дата возврата</label>
                <input type="date" name="return_date" value="{{ form.return_date }}">
            </div>
            <div class="field wide">
                <label>Примечание</label>
                <textarea name="text" placeholder="Примечание">{{ form.text }}</textarea>
            </div>
            <div class="field wide">
                <input type="submit" value="Сохранить">
            </div>
        </form>
    </div>
</body>
</html>
